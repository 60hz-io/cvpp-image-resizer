<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이미지 2MB 리사이저</title>
<meta name="description" content="JPG, PNG, HEIC 사진을 브라우저에서 바로 2MB 이하로 줄여줍니다. 서버로 업로드되지 않습니다." />
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2563eb; --accent-weak: #e8efff;
    --ok: #15803d; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #e8eaee; --muted: #9aa1ad;
      --border: #2a2f38; --accent: #6b9bff; --accent-weak: #1c2740;
      --ok: #4ade80; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .drop {
    display: block; border: 2px dashed var(--border); border-radius: 14px;
    background: var(--card); padding: 40px 16px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-weak); }
  .drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .drop input { display: none; }
  .opts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0; color: var(--muted); font-size: 14px; }
  .opts select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px; gap: 8px; }
  button {
    font: inherit; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px;
  }
  li img, li .ph { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--border); }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta .ok { color: var(--ok); } .meta .err { color: var(--err); }
  .info { min-width: 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>이미지 2MB 리사이저</h1>
  <p class="sub">JPG · PNG · HEIC(아이폰) · 안드로이드 사진을 2MB 이하로 줄여드려요. <b>모든 처리는 내 기기 안에서만</b> 이루어지고 서버로 업로드되지 않습니다.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*,.heic,.heif" multiple />
    <strong>여기를 눌러 사진 선택 또는 끌어다 놓기</strong>
    <span>여러 장 한 번에 가능 · 휴대폰에서는 앨범/카메라 선택</span>
  </label>

  <div class="opts">
    <label>목표 크기
      <select id="target">
        <option value="1">1 MB</option>
        <option value="2" selected>2 MB</option>
        <option value="5">5 MB</option>
      </select>
    </label>
  </div>

  <div class="bar" id="bar" hidden>
    <strong id="summary"></strong>
    <div>
      <button class="ghost" id="clear">지우기</button>
      <button id="zipAll">전체 저장</button>
    </div>
  </div>
  <ul id="list"></ul>

  <footer>Canvas API로 브라우저에서 처리 · 원본 파일은 바뀌지 않습니다</footer>
</main>

<script>
const MB = 1024 * 1024;
const $ = (id) => document.getElementById(id);
const results = [];

const fmt = (b) => b >= MB ? (b / MB).toFixed(2) + ' MB' : Math.round(b / 1024) + ' KB';

function isHeic(file) {
  return /image\/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name);
}

let heicLib;
async function loadHeic2any() {
  if (!heicLib) {
    heicLib = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
      s.onload = () => res(window.heic2any);
      s.onerror = () => rej(new Error('HEIC 변환 모듈을 불러오지 못했습니다'));
      document.head.appendChild(s);
    });
  }
  return heicLib;
}

// 디코딩: EXIF 회전 자동 적용. HEIC는 Safari면 네이티브, 그 외엔 heic2any(WASM, 브라우저 내 변환)
async function decode(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    if (!isHeic(file)) throw new Error('이미지를 읽을 수 없습니다');
    const heic2any = await loadHeic2any();
    const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.95 });
    const blob = Array.isArray(out) ? out[0] : out;
    return await createImageBitmap(blob, { imageOrientation: 'from-image' });
  }
}

function hasAlpha(bitmap) {
  // 축소본에서 투명 픽셀 존재 여부만 빠르게 확인
  const w = Math.min(bitmap.width, 256), h = Math.min(bitmap.height, 256);
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bitmap, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 255) return true;
  return false;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function render(bitmap, scale, fillWhite) {
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  if (fillWhite) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, w, h);
  return c;
}

const toBlob = (canvas, type, q) =>
  new Promise((res) => canvas.toBlob(res, type, q));

// 출력 형식: 투명도가 있으면 WebP(투명 유지), 아니면 JPEG
function chooseOutputType(file, alpha) {
  return alpha ? 'image/webp' : 'image/jpeg';
}

// 핵심 알고리즘: 품질 이진 탐색 → 부족하면 해상도 축소 후 반복
async function compress(bitmap, type, target) {
  const fillWhite = type === 'image/jpeg';
  // 아주 큰 사진은 캔버스 메모리 한계(특히 iOS) 때문에 먼저 긴 변 기준으로 제한
  let scale = Math.min(1, 8000 / Math.max(bitmap.width, bitmap.height));

  for (let attempt = 0; attempt < 12; attempt++) {
    const canvas = render(bitmap, scale, fillWhite);
    let lo = 0.5, hi = 0.92, best = null;

    const top = await toBlob(canvas, type, hi);
    if (top.size <= target) return { blob: top, w: canvas.width, h: canvas.height };

    for (let i = 0; i < 6; i++) {
      const q = (lo + hi) / 2;
      const b = await toBlob(canvas, type, q);
      if (b.size <= target) { best = b; lo = q; } else { hi = q; }
    }
    if (best) return { blob: best, w: canvas.width, h: canvas.height };

    // 최저 품질로도 초과 → 크기 비율에 맞춰 해상도 축소 (파일 크기 ∝ 픽셀 수)
    const low = await toBlob(canvas, type, 0.5);
    scale *= Math.max(0.5, Math.min(0.9, Math.sqrt(target / low.size) * 0.95));
  }
  throw new Error('목표 크기까지 줄이지 못했습니다');
}

function outName(name, type) {
  const base = name.replace(/\.[^.]+$/, '');
  const ext = type === 'image/webp' ? 'webp' : 'jpg';
  return `${base}_resized.${ext}`;
}

function addRow(file) {
  const li = document.createElement('li');
  li.innerHTML = `<div class="ph"></div>
    <div class="info"><div class="name"></div><div class="meta">처리 중…</div></div>
    <div class="act"></div>`;
  li.querySelector('.name').textContent = file.name;
  $('list').appendChild(li);
  return li;
}

async function handle(file, target) {
  const li = addRow(file);
  const meta = li.querySelector('.meta');
  try {
    const bitmap = await decode(file);
    const alpha = /png|webp|gif/i.test(file.type) && hasAlpha(bitmap);
    const type = chooseOutputType(file, alpha);
    const { blob, w, h } = await compress(bitmap, type, target);
    bitmap.close?.();

    const url = URL.createObjectURL(blob);
    const name = outName(file.name, type);
    results.push({ url, name });

    const img = document.createElement('img');
    img.src = url; img.alt = '';
    li.querySelector('.ph').replaceWith(img);
    meta.innerHTML = `${fmt(file.size)} → <span class="ok">${fmt(blob.size)}</span> · ${w}×${h}`;
    const a = document.createElement('a');
    a.href = url; a.download = name;
    a.innerHTML = '<button>저장</button>';
    li.querySelector('.act').appendChild(a);
  } catch (e) {
    meta.innerHTML = `<span class="err">${e.message}</span>`;
  }
}

async function processFiles(files) {
  const target = Number($('target').value) * MB * 0.98; // 2MB 경계 여유분
  $('bar').hidden = false;
  for (const f of files) await handle(f, target); // 순차 처리로 휴대폰 메모리 보호
  $('summary').textContent = `${results.length}개 완료`;
}

$('file').addEventListener('change', (e) => { processFiles([...e.target.files]); e.target.value = ''; });
const drop = $('drop');
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => processFiles([...e.dataTransfer.files]));

$('zipAll').addEventListener('click', async () => {
  for (const r of results) {
    const a = document.createElement('a');
    a.href = r.url; a.download = r.name; a.click();
    await new Promise((r) => setTimeout(r, 300));
  }
});
$('clear').addEventListener('click', () => {
  results.forEach((r) => URL.revokeObjectURL(r.url));
  results.length = 0; $('list').innerHTML = ''; $('bar').hidden = true;
});
</script>
</body>
</html>
